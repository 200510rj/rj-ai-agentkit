[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raj-ai-agentkit"
version = "0.1.0"
description = "A reusable, provider-agnostic Python toolkit for AI agent reliability primitives (Guard, Router, RAG Gate, Judge)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Raj" }
]
keywords = ["ai", "agents", "guardrails", "routing", "rag", "evaluations", "laya", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
laya = ["laya>=0.1.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
all = [
    "raj-ai-agentkit[laya,openai]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
